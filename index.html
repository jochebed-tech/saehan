<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새한교회 사랑나눔 바자회</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        .description {
            font-size: 15px;
            color: #515154;
            line-height: 1.5;
            margin-bottom: 24px;
            word-break: keep-all;
        }
        .account-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 24px;
        }
        .bank-info {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .account-number {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #2b2b2b;
            margin-bottom: 16px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-toss {
            background-color: #0064FF;
            color: #ffffff;
        }
        .btn-toss:active {
            background-color: #0052cc;
        }
        .btn-kakao {
            background-color: #FEE500;
            color: #191919;
        }
        .btn-kakao:active {
            background-color: #e6ce00;
        }
        .btn-secondary {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn-secondary:active {
            background-color: #dee2e6;
        }
        .footer-text {
            font-size: 14px;
            color: #1d1d1f;
            font-weight: 500;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">새한교회 사랑나눔 바자회</h1>
        <p class="description">구매하신 쿠폰 금액은 아래 계좌번호로 이체하여 주세요.</p>
        
        <div class="account-box">
            <div class="bank-info">신한은행(예금주: 새한교회)</div>
            <div class="account-number" id="accountDisplay">140-011-494572</div>
            
            <div class="button-group">
                <!-- 복사 후 토스 실행 -->
                <button class="btn btn-toss" onclick="copyAndOpenApp('신한 140011494572', 'supertoss://')">
                    계좌 복사 후 토스 열기
                </button>
                
                <!-- 복사 후 카카오톡 실행 -->
                <button class="btn btn-kakao" onclick="copyAndOpenApp('신한 140011494572', 'kakaotalk://')">
                    계좌 복사 후 카카오톡 열기
                </button>
                
                <!-- 계좌번호만 단순 복사 -->
                <button class="btn btn-secondary" onclick="copyOnly('140011494572')">
                    계좌번호만 복사
                </button>
            </div>
        </div>

        <p class="footer-text">이체 화면으로 확인 부탁드립니다.</p>
    </div>

    <div id="toast" class="toast">계좌가 복사되었습니다.</div>

    <script>
        // 계좌 복사 후 앱 바로 연결
        function copyAndOpenApp(textToCopy, appScheme) {
            copyToClipboard(textToCopy, () => {
                showToast("계좌가 복사되었습니다. 앱으로 이동합니다.");
                setTimeout(() => {
                    window.location.href = appScheme;
                }, 500);
            });
        }

        // 단순 복사
        function copyOnly(textToCopy) {
            copyToClipboard(textToCopy, () => {
                showToast("계좌번호가 복사되었습니다.");
            });
        }

        // 클립보드 복사 로직
        function copyToClipboard(text, callback) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(callback).catch(() => fallbackCopy(text, callback));
            } else {
                fallbackCopy(text, callback);
            }
        }

        // 구형 브라우저 대응 복사
        function fallbackCopy(text, callback) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
            if (callback) callback();
        }

        // 토스트 알림 표시
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }
    </script>

</body>
</html>
