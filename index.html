<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새한교회 사랑나눔 바자회</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        .description {
            font-size: 15px;
            color: #515154;
            line-height: 1.5;
            margin-bottom: 24px;
            word-break: keep-all;
        }
        .account-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 24px;
        }
        .bank-info {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        .account-number-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .account-number {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #2b2b2b;
        }
        .copy-btn {
            background-color: #0071e3;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .copy-btn:active {
            background-color: #005bb5;
        }
        .footer-text {
            font-size: 14px;
            color: #1d1d1f;
            font-weight: 500;
        }
        /* 알림 토스트 메시지 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">새한교회 사랑나눔 바자회</h1>
        <p class="description">구매하신 쿠폰 금액은 아래 계좌번호로 이체하여 주세요.</p>
        
        <div class="account-box">
            <div class="bank-info">신한은행(예금주: 새한교회)</div>
            <div class="account-number-wrapper">
                <span class="account-number" id="accountNum">140-011-494572</span>
                <button class="copy-btn" onclick="copyAccount()">복사</button>
            </div>
        </div>

        <p class="footer-text">이체 화면으로 확인 부탁드립니다.</p>
    </div>

    <div id="toast" class="toast">계좌번호가 복사되었습니다.</div>

    <script>
        function copyAccount() {
            const accountNum = document.getElementById("accountNum").innerText;
            
            navigator.clipboard.writeText(accountNum).then(() => {
                showToast();
            }).catch(err => {
                const textarea = document.createElement("textarea");
                textarea.value = accountNum;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }
    </script>

</body>
</html>
